name: Checked Honeybee source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: honeybee-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Source tests need tmux >= 3.3 (allow-passthrough); Ubuntu 24.04 ships 3.4.
    # Release archive packaging remains controlled by release.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install Linux test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap ripgrep socat
      - name: Require native Linux sandbox coverage
        # Fail before tests if this runner would skip the native containment probe.
        run: bwrap --new-session --die-with-parent --ro-bind / / --dev /dev --unshare-user --cap-drop ALL --unshare-pid --proc /proc -- /bin/true
      - run: npm ci
      - run: npm run check
      - run: npm run v2:check
      - run: npm run build
      - run: npm test
      - run: npm run v2:test && npm run v2:daemon && npm run v2:driver && npm run v2:driver2 && npm run v2:harness
