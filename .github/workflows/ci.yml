name: Checked Honeybee source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: honeybee-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  peercred:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build and prove the target bridge on its native runner
        shell: bash
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          node scripts/build-peercred.mjs
          node scripts/probe-peercred.mjs
      - name: Verify forced-platform daemon provenance on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export HOME="$(mktemp -d "$RUNNER_TEMP/peercred-home-XXXXXX")"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_CACHE_HOME="$HOME/cache" XDG_STATE_HOME="$HOME/state"
          brew list tmux >/dev/null 2>&1 || brew install tmux
          npm ci
          npm run build
          node scripts/run-v2-daemon-tests.mjs v2/daemon/tests/local-rpc-security.test.ts v2/daemon/tests/human-ref.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: peercred-${{ matrix.target }}
          path: dist/v2/peercred/${{ matrix.target }}/
          if-no-files-found: error
  verify:
    # Source tests need tmux >= 3.3 (allow-passthrough); Ubuntu 24.04 ships 3.4.
    # Release archive packaging remains controlled by release.yml.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install Linux test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bubblewrap ripgrep socat apparmor-profiles
      - name: Allow bubblewrap namespace setup under AppArmor
        # Ubuntu restricts unprivileged user namespaces. Its packaged profile
        # permits bwrap setup while denying capabilities to sandboxed children.
        # Keep the host restriction enabled and the preflight below unprivileged.
        run: sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Require native Linux sandbox coverage
        # Fail before tests if this runner would skip the native containment probe.
        run: bwrap --new-session --die-with-parent --ro-bind / / --dev /dev --unshare-user --cap-drop ALL --unshare-pid --proc /proc -- /bin/true
      - run: npm ci
      - run: npm run check
      - run: npm run v2:check
      - run: npm run build
      - run: npm test
      - run: npm run v2:test && npm run v2:daemon && npm run v2:driver && npm run v2:driver2 && npm run v2:harness
