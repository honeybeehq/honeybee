name: Checked Honeybee source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: honeybee-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  peercred:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build and prove the target bridge on its native runner
        shell: bash
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          node scripts/build-peercred.mjs
          node scripts/probe-peercred.mjs
      - name: Verify forced-platform daemon provenance on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export HOME="$(mktemp -d "$RUNNER_TEMP/peercred-home-XXXXXX")"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_CACHE_HOME="$HOME/cache" XDG_STATE_HOME="$HOME/state"
          brew list tmux >/dev/null 2>&1 || brew install tmux
          npm ci
          npm run build
          node scripts/run-v2-daemon-tests.mjs v2/daemon/tests/local-rpc-security.test.ts v2/daemon/tests/human-ref.test.ts v2/daemon/tests/local-rpc-trust.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: peercred-${{ matrix.target }}
          path: dist/v2/peercred/${{ matrix.target }}/
          if-no-files-found: error
  delivery-file:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Build and prove the target bridge on its native runner
        shell: bash
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          node scripts/build-delivery-file.mjs
          node scripts/probe-delivery-file.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-file-${{ matrix.target }}
          path: dist/v2/delivery-file/${{ matrix.target }}/
          if-no-files-found: error
  verify:
    # Source tests need tmux >= 3.3 (allow-passthrough); Ubuntu 24.04 ships 3.4.
    # Release archive packaging remains controlled by release.yml.
    # A push to main also runs on the organisation's own runner: a fresh VM
    # per job, labelled ci-vm. Pull requests run on the hosted runner only.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'push' && fromJSON('["ubuntu-24.04","ci-vm"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner == 'ci-vm' && fromJSON('["self-hosted","linux","x64","ci-vm"]') || matrix.runner }}
    timeout-minutes: 60
    env:
      HIVE_TEST_TIME_SCALE: "4"
      HIVE_BIRTH_CAPTURE_TIMEOUT_MS: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Install Linux test prerequisites
        # The runner image ships tmux; the rest must come from apt. The image's
        # mirror list prefers azure.archive.ubuntu.com, which at times does not
        # resolve from the runner: retry with backoff and, when it does not
        # resolve or an attempt fails, fetch from archive.ubuntu.com instead.
        run: |
          set -u
          missing=""
          for p in tmux bubblewrap ripgrep socat apparmor-profiles; do
            if ! dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'install ok installed'; then missing="$missing $p"; fi
          done
          if [ -z "$missing" ]; then echo "all prerequisites already installed"; exit 0; fi
          echo "installing:$missing"
          use_archive() {
            echo "using archive.ubuntu.com instead of the Azure mirror"
            printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\nhttp://security.ubuntu.com/ubuntu\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          }
          if ! getent hosts azure.archive.ubuntu.com >/dev/null 2>&1; then use_archive; fi
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 $missing; then exit 0; fi
            echo "apt attempt $attempt failed"
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            use_archive
            sleep $((attempt * 15))
          done
      - name: Allow bubblewrap namespace setup under AppArmor
        # Ubuntu restricts unprivileged user namespaces. Its packaged profile
        # permits bwrap setup while denying capabilities to sandboxed children.
        # Keep the host restriction enabled and the preflight below unprivileged.
        run: sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Require native Linux sandbox coverage
        # Fail before tests if this runner would skip the native containment probe.
        run: bwrap --new-session --die-with-parent --ro-bind / / --dev /dev --unshare-user --cap-drop ALL --unshare-pid --proc /proc -- /bin/true
      - name: Allow the secret execution supervisor namespace under AppArmor
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile hive-ci-unshare /usr/bin/unshare flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/hive-ci-unshare >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/hive-ci-unshare
          /usr/bin/unshare --user --map-current-user --pid --mount --mount-proc --fork --kill-child=SIGKILL /bin/true
      - run: npm ci
      - run: npm run v2:check
      - run: npm run build
      - run: npm run release:test
      - run: npm run v2:test && npm run v2:daemon && npm run v2:driver && npm run v2:driver2 && npm run v2:harness
