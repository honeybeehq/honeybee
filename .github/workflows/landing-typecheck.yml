name: Landing typecheck
on:
  push:
    branches: ['review/landing-candidate/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: landing-typecheck-${{ github.sha }}
  cancel-in-progress: false
jobs:
  landing-typecheck:
    name: landing-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run check && npm run v2:check
